name: Telegram - Post do Dia

on:
  push:
    branches: [main]
    paths:
      - 'instagram-content/**.md'

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Enviar no Telegram
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -e
          FILE=$(git diff --name-only HEAD~1 HEAD -- 'instagram-content/*.md' | head -1)
          echo "Arquivo: '$FILE'"
          [ -z "$FILE" ] && echo "Sem arquivo novo." && exit 0
          DATE=$(basename "$FILE" .md)
          MD_FILE="$FILE" POST_DATE="$DATE" python3 .github/scripts/send_telegram.py
