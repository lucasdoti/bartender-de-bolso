name: EAS Update (Expo Go)

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      message:
        description: "Mensagem do update"
        required: false
        default: "Update manual"

jobs:
  update:
    name: Publicar update para Expo Go
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Publicar update (canal production)
        run: eas update --branch production --message "Deploy ${{ github.sha }}" --non-interactive
