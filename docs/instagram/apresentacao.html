<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Apresentação - Bartender de Bolso</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Abril+Fatface&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg:    #EDE8D8;
  --ink:   #1B3E22;
  --acc:   #D4C020;
  --acc2:  #A89618;
  --muted: rgba(27,62,34,.5);
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  width: 1080px;
  height: 1080px;
  background: var(--bg);
  font-family: 'Inter', sans-serif;
  overflow: hidden;
}
.card {
  width: 1080px;
  height: 1080px;
  background: var(--bg);
  border: 5px solid var(--ink);
  display: flex;
  flex-direction: column;
  padding: 56px 69px 43px;
  position: relative;
  overflow: hidden;
}
.circle {
  position: absolute;
  border-radius: 50%;
  border: 3px solid var(--ink);
  pointer-events: none;
  opacity: .05;
}
.eyebrow {
  font-size: 19px;
  font-weight: 800;
  letter-spacing: 8px;
  text-transform: uppercase;
  color: var(--muted);
  display: flex;
  align-items: center;
  gap: 22px;
  flex-shrink: 0;
  margin-bottom: 13px;
}
.eyebrow::after {
  content: '';
  flex: 1; height: 2px;
  background: currentColor;
}
.headline {
  font-family: 'Abril Fatface', serif;
  font-size: 165px;
  line-height: .88;
  color: var(--ink);
  text-transform: uppercase;
  margin: 0 0 26px;
  flex-shrink: 0;
}
.acc-bar {
  width: 82px; height: 9px;
  background: var(--acc);
  margin-bottom: 26px;
  flex-shrink: 0;
}
.mission {
  flex: 1;
  display: flex;
  flex-direction: column;
  justify-content: center;
}
.mission-text {
  font-size: 28px;
  line-height: 1.55;
  color: var(--ink);
  font-weight: 500;
}
.mission-text strong { font-weight: 800; }
.sep { height: 3px; background: var(--ink); opacity: .1; flex-shrink: 0; margin: 20px 0; }
.diffs {
  display: flex;
  flex-direction: column;
  gap: 11px;
  flex-shrink: 0;
  padding: 4px 0 20px;
}
.diff {
  font-size: 22px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 2px;
  color: var(--muted);
  display: flex;
  align-items: center;
  gap: 17px;
}
.diff::before {
  content: '';
  width: 11px; height: 11px;
  border-radius: 50%;
  background: var(--acc);
  flex-shrink: 0;
}
.footer {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  flex-shrink: 0;
  padding-top: 17px;
  border-top: 3px solid rgba(27,62,34,.1);
}
.handle { font-size: 24px; font-weight: 700; color: var(--ink); }
.tagline { font-size: 19px; color: var(--muted); text-transform: uppercase; letter-spacing: 2px; font-weight: 600; }
</style>
</head>
<body>
  <div class="card">
    <div class="circle" style="width:430px;height:430px;bottom:-130px;right:-130px;"></div>
    <div class="circle" style="width:195px;height:195px;bottom:65px;right:65px;"></div>

    <p class="eyebrow">Bem-vindo</p>
    <h1 class="headline">Seu bar<br>em casa</h1>
    <div class="acc-bar"></div>

    <div class="mission">
      <p class="mission-text">
        Drinks <strong>clássicos e modernos</strong> feitos com ingredientes
        que você já tem em casa — sem precisar ser bartender.
      </p>
    </div>

    <div class="sep"></div>

    <div class="diffs">
      <span class="diff">Receitas acessíveis e fáceis</span>
      <span class="diff">Drinks famosos do mundo todo</span>
      <span class="diff">Passo a passo detalhado</span>
      <span class="diff">Curiosidades sobre cada drink</span>
    </div>

    <div class="footer">
      <span class="handle">@bartenderdebolso</span>
      <span class="tagline">Siga e aprenda</span>
    </div>
  </div>
</body>
</html>
