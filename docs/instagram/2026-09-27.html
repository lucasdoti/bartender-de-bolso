<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Kir Royal - Bartender de Bolso</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 1080px;
    height: 1080px;
    background: #0D0D14;
    overflow: hidden;
    font-family: 'Inter', sans-serif;
  }
  body {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }
  .glow {
    position: absolute;
    width: 700px;
    height: 700px;
    background: rgba(155, 111, 212, 0.18);
    border-radius: 50%;
    filter: blur(60px);
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    z-index: 1;
  }
  .grid {
    position: absolute;
    top: 0;
    left: 0;
    width: 1080px;
    height: 1080px;
    background-image:
      linear-gradient(rgba(155, 111, 212, 0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(155, 111, 212, 0.03) 1px, transparent 1px);
    background-size: 40px 40px;
    z-index: 2;
  }
  .content {
    position: relative;
    z-index: 3;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
  }
  .eyebrow {
    font-size: 13px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: #9B6FD4;
    font-weight: 600;
    margin-bottom: 28px;
  }
  .emoji {
    font-size: 120px;
    line-height: 1;
    margin-bottom: 24px;
  }
  .drink-name {
    font-family: 'Playfair Display', serif;
    font-size: 72px;
    font-weight: 900;
    color: #FFFFFF;
    margin-bottom: 32px;
  }
  .divider {
    width: 200px;
    height: 1px;
    background: rgba(155, 111, 212, 0.3);
    margin-bottom: 32px;
  }
  .ingredients {
    display: flex;
    flex-direction: column;
    gap: 16px;
    margin-bottom: 56px;
  }
  .ingredient {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    font-size: 22px;
    font-weight: 600;
    color: rgba(240, 234, 255, 0.8);
  }
  .dot {
    width: 8px;
    height: 8px;
    min-width: 8px;
    border-radius: 50%;
    background: #FFD966;
  }
  .handle {
    font-size: 18px;
    color: #9B6FD4;
    font-weight: 700;
    margin-bottom: 6px;
  }
  .appname {
    font-size: 14px;
    color: #8A8A99;
    font-weight: 400;
  }
</style>
</head>
<body>
  <div class="glow"></div>
  <div class="grid"></div>
  <div class="content">
    <div class="eyebrow">App de Coqueteis</div>
    <div class="emoji">🥂</div>
    <div class="drink-name">Kir Royal</div>
    <div class="divider"></div>
    <div class="ingredients">
      <div class="ingredient"><span class="dot"></span>Creme de cassis 20ml</div>
      <div class="ingredient"><span class="dot"></span>Champagne 120ml</div>
    </div>
    <div class="handle">@bartenderdebolso</div>
    <div class="appname">Bartender de Bolso</div>
  </div>
</body>
</html>
