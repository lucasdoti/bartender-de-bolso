<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Caipirinha - Bartender de Bolso</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: 1080px;
    height: 1080px;
    background: #0D0D14;
    font-family: 'Inter', sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    position: relative;
  }

  /* grid overlay */
  body::before {
    content: '';
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(rgba(155,111,212,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(155,111,212,0.03) 1px, transparent 1px);
    background-size: 40px 40px;
    z-index: 0;
  }

  /* purple glow */
  .glow {
    position: absolute;
    width: 700px;
    height: 700px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(155,111,212,0.18) 0%, transparent 70%);
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    z-index: 0;
  }

  /* second accent glow (green-yellow for caipirinha lime) */
  .glow2 {
    position: absolute;
    width: 400px;
    height: 400px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(180,220,60,0.07) 0%, transparent 70%);
    bottom: 80px;
    right: 80px;
    z-index: 0;
  }

  .card {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    padding: 0 80px;
    width: 100%;
  }

  .eyebrow {
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: #9B6FD4;
    margin-bottom: 28px;
  }

  .emoji {
    font-size: 120px;
    line-height: 1;
    margin-bottom: 28px;
    filter: drop-shadow(0 0 24px rgba(180,220,60,0.25));
  }

  .drink-name {
    font-family: 'Playfair Display', serif;
    font-size: 88px;
    font-weight: 900;
    color: #ffffff;
    line-height: 1;
    letter-spacing: -1px;
    margin-bottom: 32px;
  }

  .divider {
    width: 200px;
    height: 1px;
    background: rgba(155,111,212,0.3);
    margin-bottom: 36px;
  }

  .ingredients {
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 12px;
    margin-bottom: 56px;
  }

  .ingredients li {
    display: flex;
    align-items: center;
    gap: 14px;
    font-size: 22px;
    font-weight: 600;
    color: rgba(240,234,255,0.85);
  }

  .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #FFD966;
    flex-shrink: 0;
  }

  .bottom {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
  }

  .handle {
    font-size: 18px;
    font-weight: 700;
    color: #9B6FD4;
    letter-spacing: 0.5px;
  }

  .app-name {
    font-size: 14px;
    color: rgba(144,128,168,0.8);
    font-weight: 400;
  }
</style>
</head>
<body>
  <div class="glow"></div>
  <div class="glow2"></div>

  <div class="card">
    <p class="eyebrow">App de Coquetéis</p>
    <div class="emoji">🍋</div>
    <h1 class="drink-name">Caipirinha</h1>
    <div class="divider"></div>
    <ul class="ingredients">
      <li><span class="dot"></span>Cachaça 50ml</li>
      <li><span class="dot"></span>1 limão tahiti</li>
      <li><span class="dot"></span>Açúcar 2 col. de sopa</li>
      <li><span class="dot"></span>Gelo a gosto</li>
    </ul>
    <div class="bottom">
      <span class="handle">@bartenderdebolso</span>
      <span class="app-name">Bartender de Bolso</span>
    </div>
  </div>
</body>
</html>
